name: Build macOS DMG

# Dispatch this workflow from a release/<version> tag; the tagged commit is
# built and the version is taken from the tag name.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != release/* ]]; then
            echo "::error::Run this workflow from a release/<version> tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            exit 1
          fi

          version="${GITHUB_REF_NAME#release/}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not contain a valid version."
            exit 1
          fi

          # build_macos.sh embeds `git describe` output in the app, so make sure
          # it matches the version used for the DMG filename and release.
          described="$(git describe --tags --always)"
          if [[ "$described" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::git describe reports '$described', expected '$GITHUB_REF_NAME'."
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install virtualenv
        run: python -m pip install virtualenv

      - name: Create virtual environment
        run: python -m virtualenv .venv

      - name: Build DMG
        run: ./script/build_macos.sh

      - name: Rename DMG
        run: mv dist/ToanMachine.dmg "dist/ToanMachine-${VERSION}.dmg"

      - name: Attest DMG
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/ToanMachine-${{ env.VERSION }}.dmg

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          
          # Notes
          * This is an auto-generated release. Release notes pending.
          
          # Installation
          To install the MacOS build:
          * Open the DMG and copy ToanMachine.app to your Applications directory.
          * Open a terminal.
          * Run \`xattr -cr /Applications/ToanMachine.app\`.
          
          You only have to run \`xattr\` once after installing or updating, after that you can open ToanMachine.app like a normal application.
          
          # Build Details
          Built by GitHub Actions.

          - [Build run]($RUN_URL)
          - [Build attestation]($ATTESTATION_URL)
          EOF

          gh release create "$GITHUB_REF_NAME" "dist/ToanMachine-${VERSION}.dmg" \
            --verify-tag \
            --title "$VERSION" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Print DMG SHA256
        run: shasum -a 256 "dist/ToanMachine-${VERSION}.dmg"
