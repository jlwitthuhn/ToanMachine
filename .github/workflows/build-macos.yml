name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string for the release/<version> tag and DMG filename
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || ! git check-ref-format "refs/tags/release/$VERSION"; then
            echo "Version must form a valid release/<version> Git tag."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install virtualenv
        run: python -m pip install virtualenv

      - name: Create virtual environment
        run: python -m virtualenv .venv

      - name: Build DMG
        run: ./script/build_macos.sh

      - name: Rename DMG
        run: mv dist/ToanMachine.dmg "dist/ToanMachine-${VERSION}.dmg"

      - name: Attest DMG
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/ToanMachine-${{ env.VERSION }}.dmg

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          
          # Notes
          * This is an auto-generated release. Release notes pending.
          
          # Installation
          To install the MacOS build:
          * Open the DMG and copy ToanMachine.app to your Applications directory.
          * Open a terminal.
          * Run \`xattr -cr /Applications/ToanMachine.app\`.
          
          You only have to run \`xattr\` once, after that you can open ToanMachine.app like a normal application.
          
          # Build Details
          Built by GitHub Actions.

          - [Build run]($RUN_URL)
          - [Build attestation]($ATTESTATION_URL)
          EOF

          gh release create "release/$VERSION" "dist/ToanMachine-${VERSION}.dmg" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Print DMG SHA256
        run: shasum -a 256 "dist/ToanMachine-${VERSION}.dmg"
